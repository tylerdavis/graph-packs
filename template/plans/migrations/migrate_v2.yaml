version: 2
identifier: migrate_v2
name: Migrate to example v2
description: Rewrites the plans, agents and tools that call this pack's v1 names to its v2 names and inputs. With apply false it changes nothing and returns each file's diff.
input_schema:
  type: object
  required: [root]
  properties:
    root:
      type: string
      description: Directory holding the plans, agents and tools directories to migrate, such as .graph or ~/.config/graph
    apply:
      type: boolean
      default: false
      description: Write the migrated files; false only returns diffs
output_schema:
  type: object
  required: [applied, files]
  properties:
    applied: { type: boolean }
    files:
      type: array
      items:
        type: object
        properties:
          path:    { type: string }
          changed: { type: boolean }
          applied: { type: boolean }
          diff:    { type: string }
steps:
  - id: scan
    tool_name: $pack__tool__migrate_v2_scan
    input:
      pack: "{{pack.name}}"
      root: "{{input.root}}"
  - id: nothing_to_do
    tool_name: exit
    input:
      when: { value: "{{scan.files}}", op: empty }
      status: success
      message: No plan, agent or tool calls this pack's v1 names
      output: { applied: false, files: [] }
  - id: migrate
    tool_name: map
    input:
      over: "{{scan.files}}"
      concurrency: 4
      do:
        - id: rewrite
          tool_name: builtin__infer
          input:
            instruction: |-
              Migrate one graph file from version 1 to version 2 of the "{{pack.name}}" pack. Make exactly these changes and nothing else:

              1. Rename the tool {{pack.name}}__tool__file_stats to {{pack.name}}__tool__file_info wherever it appears, including in an agent's tools list and in prose inside a system prompt.
              2. In every plan step whose tool_name is {{pack.name}}__tool__file_info, {{pack.name}}__tool__file_stats or {{pack.name}}__plan__describe_file, rename the input key path to file and keep its value unchanged. The same applies to map, reduce and route bodies that call those tools.
              3. Leave every other occurrence of path alone, including output fields, which are unchanged in version 2.

              The file's top-level version key is graph's file format version, not the pack's version. Never change it.

              Keep everything else byte for byte: comments, key order, quoting, indentation and blank lines. If nothing needs to change, return the file unchanged. Return the whole file as content.

              File: {{item.path}}

              {{item.content}}
            output_schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
        - id: write
          tool_name: $pack__tool__migrate_v2_write
          input:
            path: "{{item.path}}"
            content: "{{rewrite.content}}"
            apply: "{{input.apply}}"
finish:
  output:
    applied: "{{input.apply}}"
    files: "{{migrate.results}}"
