version: 2
name: file_info
description: >
  Size, line and word counts, MIME type, and the first 4 KB of a file on
  disk. Use before summarizing or classifying a file.
kind: exec
command: bash
args:
  - "-ceuo"
  - "pipefail"
  - |
    f=$1
    read -r lines words bytes _ < <(wc -lwc -- "$f")
    jq -n \
      --arg path "$f" \
      --arg mime "$(file -b --mime-type -- "$f")" \
      --argjson lines "$lines" --argjson words "$words" --argjson bytes "$bytes" \
      --rawfile excerpt <(head -c 4096 -- "$f") \
      '{path: $path, mime: $mime, lines: $lines, words: $words, bytes: $bytes, excerpt: $excerpt}'
  - file_info
  - "{{input.file}}"
output: json
timeout_secs: 10
read_only: true
input_schema:
  type: object
  required: [file]
  properties:
    file: { type: string, description: Path to the file, absolute or relative to the working directory }
output_schema:
  type: object
  properties:
    path:    { type: string }
    mime:    { type: string }
    lines:   { type: integer }
    words:   { type: integer }
    bytes:   { type: integer }
    excerpt: { type: string }
