[package]
name = "web"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
htmd = "0.5"
markup5ever_rcdom = "0.38"
tendril = "0.5"
html5ever = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2", "gzip", "charset"] }
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
